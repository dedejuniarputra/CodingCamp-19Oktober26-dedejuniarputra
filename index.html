<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top Bar ── -->
  <header class="top-bar">
    <div class="theme-toggle">
      <label class="switch" title="Toggle dark mode">
        <input type="checkbox" id="themeToggle" />
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Dark Mode</span>
    </div>

    <div class="name-control">
      <span id="nameDisplay"></span>
      <button id="editNameBtn" class="btn-icon" title="Edit your name">✏️</button>
    </div>
  </header>

  <main class="container">

    <!-- ── Greeting Card ── -->
    <section class="card greeting-card" id="greetingCard">
      <div class="time" id="clock">00:00:00</div>
      <div class="date" id="dateDisplay"></div>
      <div class="greeting" id="greetingText">Hello!</div>
    </section>

    <!-- ── Middle Row ── -->
    <div class="middle-row">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="timer-duration-row">
          <label for="timerMinutes">Duration (min):</label>
          <input type="number" id="timerMinutes" min="1" max="99" value="25" />
          <button class="btn btn-secondary" id="applyDuration">Apply</button>
        </div>

        <div class="timer-buttons">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-secondary" id="stopBtn">Stop</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
      </section>

      <!-- Tasks -->
      <section class="card tasks-card">
        <div class="tasks-header">
          <h2>Tasks</h2>
          <div class="sort-control">
            <label for="sortSelect">Sort:</label>
            <select id="sortSelect">
              <option value="none">Default</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="done">Done last</option>
            </select>
          </div>
        </div>

        <div class="task-input-row">
          <input type="text" id="taskInput" placeholder="Add a new task…" />
          <button class="btn btn-primary" id="addTaskBtn">Add</button>
        </div>

        <div class="task-error" id="taskError"></div>

        <ul class="task-list" id="taskList"></ul>
      </section>

    </div><!-- /.middle-row -->

    <!-- ── Quick Links ── -->
    <section class="card links-card">
      <h2>Quick Links</h2>

      <div class="link-input-row">
        <input type="text" id="linkName" placeholder="Link name" />
        <input type="url" id="linkUrl" placeholder="https://…" />
        <button class="btn btn-primary" id="addLinkBtn">Add Link</button>
      </div>

      <div class="link-error" id="linkError"></div>

      <div class="link-list" id="linkList"></div>
    </section>

  </main>

  <!-- ── Name Modal ── -->
  <div class="modal-overlay" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle">What's your name?</h3>
      <input type="text" id="nameInput" placeholder="Enter your name…" maxlength="40" />
      <div class="modal-buttons">
        <button class="btn btn-primary" id="saveNameBtn">Save</button>
        <button class="btn btn-secondary" id="cancelNameBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
